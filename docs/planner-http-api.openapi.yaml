openapi: 3.1.0
info:
  title: WebGPT Planner HTTP API
  version: 0.3.0
  description: |
    HTTP contract implemented by the default WebGPT planner adapter.
    WebGPT frontend hosts consume a JavaScript plannerAdapter
    interface; this OpenAPI document describes the HTTP routes used by the
    default adapter implementation, including browser DOM, Google Sheets,
    Microsoft Excel runtime surfaces, connector-enabled site-adapter tools,
    and frame-owned WebMCP page tools.
servers:
  - url: https://webgpt-backend-production.up.railway.app
    description: Hosted WebGPT planner
  - url: http://localhost:3000
    description: Local full WebGPT planner
  - url: http://localhost:8787
    description: Simple local backend example
tags:
  - name: Runs
  - name: Template Runs
  - name: Artifacts

paths:
  /runs/start-command:
    post:
      tags: [Runs]
      operationId: startCommandRun
      summary: Start an agent run and return the first runtime command.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartCommandRunRequest"
      responses:
        "200":
          description: Run started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartCommandRunResponse"
        default:
          $ref: "#/components/responses/ErrorJson"

  /template-runs/start-command:
    post:
      tags: [Template Runs]
      operationId: startTemplateQueueCommand
      summary: Start a template queue and return the first item command.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartTemplateQueueRequest"
      responses:
        "200":
          description: Template queue started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateQueueCommandResponse"
        default:
          $ref: "#/components/responses/ErrorJson"

  /template-runs/{templateRunId}:
    get:
      tags: [Template Runs]
      operationId: getTemplateRun
      summary: Get the latest template queue snapshot.
      parameters:
        - $ref: "#/components/parameters/TemplateRunId"
      responses:
        "200":
          description: Template queue snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [ok, queue]
                properties:
                  ok:
                    type: boolean
                    const: true
                  queue:
                    $ref: "#/components/schemas/TemplateQueueSnapshot"
        default:
          $ref: "#/components/responses/ErrorJson"

  /template-runs/{templateRunId}/complete-current-command:
    post:
      tags: [Template Runs]
      operationId: completeTemplateQueueItem
      summary: Complete the current template item and optionally return the next item.
      parameters:
        - $ref: "#/components/parameters/TemplateRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteTemplateQueueItemRequest"
      responses:
        "200":
          description: Template item completion result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteTemplateQueueItemResponse"
        default:
          $ref: "#/components/responses/ErrorJson"

  /runs/{runId}:
    get:
      tags: [Runs]
      operationId: getRun
      summary: Get the latest backend run snapshot.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [ok, run]
                properties:
                  ok:
                    type: boolean
                    const: true
                  run:
                    $ref: "#/components/schemas/RunSnapshot"
        default:
          $ref: "#/components/responses/ErrorJson"

  /runs/{runId}/command-result:
    post:
      tags: [Runs]
      operationId: postCommandResult
      summary: Submit frontend-host progress and receive the next runtime command.
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandResultRequest"
      responses:
        "200":
          description: Next runtime command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        default:
          $ref: "#/components/responses/ErrorJson"

  /runs/{runId}/provide-hint:
    post:
      tags: [Runs]
      operationId: provideHumanHint
      summary: Resume a paused run with human guidance.
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvideHumanHintRequest"
      responses:
        "200":
          description: Hint accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunMutationResponse"
        default:
          $ref: "#/components/responses/ErrorJson"

  /runs/{runId}/confirm-success:
    post:
      tags: [Runs]
      operationId: confirmRunSuccess
      summary: Confirm that a completed run succeeded.
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Success confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunMutationResponse"
        default:
          $ref: "#/components/responses/ErrorJson"

  /runs/{runId}/reject-success:
    post:
      tags: [Runs]
      operationId: rejectRunSuccess
      summary: Reject a completion and resume the run.
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hint:
                  type: string
                  default: ""
      responses:
        "200":
          description: Completion rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RejectSuccessResponse"
        default:
          $ref: "#/components/responses/ErrorJson"

  /runs/{runId}/stop:
    post:
      tags: [Runs]
      operationId: stopRun
      summary: Stop or delete a backend run.
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopRunRequest"
      responses:
        "200":
          description: Run stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        default:
          $ref: "#/components/responses/ErrorJson"

  /artifacts:
    get:
      tags: [Artifacts]
      operationId: fetchArtifacts
      summary: List saved successful run artifacts.
      responses:
        "200":
          description: Artifact list.
          content:
            application/json:
              schema:
                type: object
                required: [ok, artifacts]
                properties:
                  ok:
                    type: boolean
                    const: true
                  artifacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/SavedArtifactSummary"
        default:
          $ref: "#/components/responses/ErrorJson"

  /artifacts/{fileName}:
    get:
      tags: [Artifacts]
      operationId: fetchArtifact
      summary: Fetch a saved successful run, execution trace, or replay artifact by file name.
      parameters:
        - $ref: "#/components/parameters/FileName"
      responses:
        "200":
          description: Saved artifact payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactByFileNameResponse"
        default:
          $ref: "#/components/responses/ErrorJson"

  /save-successful-run:
    post:
      tags: [Artifacts]
      operationId: saveSuccessfulRun
      summary: Persist the successful run snapshot.
      requestBody:
        $ref: "#/components/requestBodies/SaveSuccessfulArtifactRequest"
      responses:
        "200":
          $ref: "#/components/responses/GenericJsonSuccess"
        default:
          $ref: "#/components/responses/ErrorJson"

  /save-successful-execution-trace:
    post:
      tags: [Artifacts]
      operationId: saveSuccessfulExecutionTrace
      summary: Persist the successful execution trace.
      requestBody:
        $ref: "#/components/requestBodies/SaveSuccessfulArtifactRequest"
      responses:
        "200":
          $ref: "#/components/responses/GenericJsonSuccess"
        default:
          $ref: "#/components/responses/ErrorJson"

  /save-successful-replay-artifacts:
    post:
      tags: [Artifacts]
      operationId: saveSuccessfulReplayArtifacts
      summary: Persist replay artifacts for a successful run.
      requestBody:
        $ref: "#/components/requestBodies/SaveSuccessfulArtifactRequest"
      responses:
        "200":
          $ref: "#/components/responses/GenericJsonSuccess"
        default:
          $ref: "#/components/responses/ErrorJson"

  /find-replay-artifact:
    post:
      tags: [Artifacts]
      operationId: findReplayArtifact
      summary: Find the closest saved replay artifact for a goal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                goal:
                  type: string
      responses:
        "200":
          description: Replay artifact match, if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindReplayArtifactResponse"
        default:
          $ref: "#/components/responses/ErrorJson"

components:
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    TemplateRunId:
      name: templateRunId
      in: path
      required: true
      schema:
        type: string
    FileName:
      name: fileName
      in: path
      required: true
      schema:
        type: string

  requestBodies:
    SaveSuccessfulArtifactRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [runId]
            properties:
              runId:
                type: string

  responses:
    GenericJsonSuccess:
      description: Successful JSON response. The frontend forwards this result to the UI.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SaveSuccessfulArtifactResponse"

    ErrorJson:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    ErrorResponse:
      type: object
      required: [ok, error]
      additionalProperties: true
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
          description: Human-readable error message consumed by the frontend.
        code:
          type: string
          description: Optional stable machine-readable error code.
        details:
          $ref: "#/components/schemas/NullableObject"

    AnyObject:
      type: object
      additionalProperties: true

    NullableObject:
      oneOf:
        - $ref: "#/components/schemas/AnyObject"
        - type: "null"

    StartCommandRunRequest:
      type: object
      required: [goal]
      properties:
        goal:
          type: string
        inputValues:
          $ref: "#/components/schemas/AnyObject"
        isTemplateRun:
          type: boolean
          default: false
        state:
          oneOf:
            - $ref: "#/components/schemas/ExtractedState"
            - type: "null"
        userHint:
          type: string
          default: ""
        browserContext:
          $ref: "#/components/schemas/BrowserContext"
        artifactFileName:
          type: string
          default: ""
        surface:
          type: string
          default: ""
          examples: [browser_dom, google_sheets, microsoft_excel]
        profileAttachments:
          type: array
          description: Optional run-scoped profile attachments, currently resume or cover letter files supplied at run start.
          items:
            $ref: "#/components/schemas/ProfileAttachmentInput"
        myInfo:
          description: Optional user profile/context supplied by the frontend host for planner use.
          oneOf:
            - $ref: "#/components/schemas/AnyObject"
            - type: "null"
        attachments:
          type: array
          description: Optional host-defined run attachments. Profile attachments should use profileAttachments when possible.
          items:
            type: object
            additionalProperties: true

    StartTemplateQueueRequest:
      type: object
      required: [goalTemplate]
      properties:
        goalTemplate:
          type: string
        inputSchema:
          type: array
          items:
            $ref: "#/components/schemas/InputSchemaItem"
        inputValues:
          $ref: "#/components/schemas/AnyObject"
        artifactFileName:
          type: string
          default: ""
        surface:
          type: string
          default: ""
          examples: [browser_dom, google_sheets, microsoft_excel]
        myInfo:
          description: Optional user profile/context supplied by the frontend host for planner use.
          oneOf:
            - $ref: "#/components/schemas/AnyObject"
            - type: "null"

    ProfileAttachmentInput:
      type: object
      additionalProperties: false
      required: [name, role, contentBase64]
      properties:
        name:
          type: string
        mimeType:
          type: string
          default: ""
        size:
          type: integer
          minimum: 0
        role:
          type: string
          enum: [resume, cover_letter]
        contentBase64:
          type: string
          description: Base64-encoded .txt, .md, or .pdf content. The backend extracts text and does not persist raw bytes.

    CompleteTemplateQueueItemRequest:
      type: object
      required: [runId]
      properties:
        runId:
          type: string
        summary:
          type: string
          default: ""
        finalResult:
          description: Planner-defined final result for the completed item.
          oneOf:
            - $ref: "#/components/schemas/AnyObject"
            - type: "null"

    CommandResultRequest:
      oneOf:
        - $ref: "#/components/schemas/ReplayPreflightRequestedResult"
        - $ref: "#/components/schemas/StateExtractedResult"
        - $ref: "#/components/schemas/NavigationCompletedResult"
        - $ref: "#/components/schemas/ActionsExecutedResult"
        - $ref: "#/components/schemas/GoogleSheetsCommandsExecutedResult"
        - $ref: "#/components/schemas/MicrosoftExcelCommandsExecutedResult"
        - $ref: "#/components/schemas/NavigationDetectedResult"
        - $ref: "#/components/schemas/ReplayBatchExecutedResult"
      discriminator:
        propertyName: type

    BaseCommandResultRequest:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          $ref: "#/components/schemas/CommandResultType"
        surface:
          type: string
          examples: [browser_dom, google_sheets, microsoft_excel]
        step:
          type:
            - integer
            - "null"
        command:
          oneOf:
            - $ref: "#/components/schemas/Command"
            - $ref: "#/components/schemas/AnyObject"
        state:
          oneOf:
            - $ref: "#/components/schemas/ExtractedState"
            - type: "null"
        execution:
          oneOf:
            - $ref: "#/components/schemas/ExecutionResult"
            - type: "null"
        postState:
          oneOf:
            - $ref: "#/components/schemas/ExtractedState"
            - type: "null"
        userHint:
          type: string
          default: ""
        browserContext:
          $ref: "#/components/schemas/BrowserContext"
        artifactFileName:
          type: string
          default: ""
        navigationInfo:
          $ref: "#/components/schemas/NavigationInfo"
        batchResult:
          oneOf:
            - $ref: "#/components/schemas/ReplayBatchResult"
            - type: "null"
        navigationInterrupted:
          type: boolean
          default: false

    ReplayPreflightRequestedResult:
      allOf:
        - $ref: "#/components/schemas/BaseCommandResultRequest"
        - type: object
          required: [type]
          properties:
            type:
              const: replay_preflight_requested
            artifactFileName:
              type: string
              default: ""
      examples:
        - type: replay_preflight_requested
          artifactFileName: saved-run.json

    StateExtractedResult:
      allOf:
        - $ref: "#/components/schemas/BaseCommandResultRequest"
        - type: object
          required: [type, state]
          properties:
            type:
              const: state_extracted
            state:
              $ref: "#/components/schemas/ExtractedState"
            userHint:
              type: string
              default: ""
            browserContext:
              $ref: "#/components/schemas/BrowserContext"
            artifactFileName:
              type: string
              default: ""
      examples:
        - type: state_extracted
          state:
            url: https://example.com
            title: Example
            frames:
              "0":
                frameId: 0
                url: https://example.com
                title: Example
          userHint: ""
          browserContext:
            tabId: 123
            observedUrl: https://example.com
          artifactFileName: ""

    NavigationCompletedResult:
      allOf:
        - $ref: "#/components/schemas/BaseCommandResultRequest"
        - type: object
          required: [type, state]
          properties:
            type:
              const: navigation_completed
            state:
              $ref: "#/components/schemas/ExtractedState"
            userHint:
              type: string
              default: ""
            browserContext:
              $ref: "#/components/schemas/BrowserContext"
            artifactFileName:
              type: string
              default: ""
      examples:
        - type: navigation_completed
          state:
            url: https://example.com/results
            title: Results
            frames:
              "0":
                frameId: 0
                url: https://example.com/results
                title: Results
          userHint: ""
          browserContext:
            tabId: 123
            observedUrl: https://example.com/results
          artifactFileName: ""

    ActionsExecutedResult:
      allOf:
        - $ref: "#/components/schemas/BaseCommandResultRequest"
        - type: object
          required: [type, command, execution, postState]
          properties:
            type:
              const: actions_executed
            command:
              $ref: "#/components/schemas/RunActionsCommand"
            execution:
              $ref: "#/components/schemas/ExecutionResult"
            postState:
              $ref: "#/components/schemas/ExtractedState"
            browserContext:
              $ref: "#/components/schemas/BrowserContext"
            navigationInfo:
              $ref: "#/components/schemas/NavigationInfo"
      examples:
        - type: actions_executed
          command:
            type: run_actions
            runId: run_123
            step: 2
            actions:
              - type: fill
                targetId: el_12
                frameId: 0
                value: 423 N Holly St
          execution:
            ok: true
            summary: All actions executed.
            results: []
          postState:
            url: https://example.com
            title: Example
            frames:
              "0":
                frameId: 0
                url: https://example.com
                title: Example
          browserContext:
            tabId: 123
            observedUrl: https://example.com

    GoogleSheetsCommandsExecutedResult:
      allOf:
        - $ref: "#/components/schemas/BaseCommandResultRequest"
        - type: object
          required: [type, command, execution, postState]
          properties:
            type:
              const: google_sheets_commands_executed
            surface:
              const: google_sheets
            command:
              $ref: "#/components/schemas/RunGoogleSheetsCommandsCommand"
            execution:
              $ref: "#/components/schemas/ExecutionResult"
            postState:
              $ref: "#/components/schemas/ExtractedState"
            browserContext:
              $ref: "#/components/schemas/BrowserContext"
      examples:
        - type: google_sheets_commands_executed
          surface: google_sheets
          command:
            type: run_google_sheets_commands
            surface: google_sheets
            runId: run_123
            step: 2
            commands:
              - name: write_values
                sheetName: Sheet1
                range: Sheet1!A1:B2
                values:
                  - [Name, Status]
                  - [Ada, Done]
          execution:
            ok: true
            summary: Google Sheets commands executed.
            results: []
          postState:
            surface: google_sheets
            spreadsheetTitle: CRM
            visibleGrid:
              range: Sheet1!A1:B20
              values: []
          browserContext:
            tabId: 123
            surface: google_sheets
            observedUrl: https://docs.google.com/spreadsheets/d/sheet-id/edit

    MicrosoftExcelCommandsExecutedResult:
      allOf:
        - $ref: "#/components/schemas/BaseCommandResultRequest"
        - type: object
          required: [type, command, execution, postState]
          properties:
            type:
              const: microsoft_excel_commands_executed
            surface:
              const: microsoft_excel
            command:
              $ref: "#/components/schemas/RunMicrosoftExcelCommandsCommand"
            execution:
              $ref: "#/components/schemas/ExecutionResult"
            postState:
              $ref: "#/components/schemas/ExtractedState"
            browserContext:
              $ref: "#/components/schemas/BrowserContext"
      examples:
        - type: microsoft_excel_commands_executed
          surface: microsoft_excel
          command:
            type: run_microsoft_excel_commands
            surface: microsoft_excel
            runId: run_123
            step: 2
            commands:
              - name: write_range
                worksheetName: Sheet1
                range: A1:B2
                values:
                  - [Name, Status]
                  - [Ada, Done]
          execution:
            ok: true
            summary: Microsoft Excel commands executed.
            results: []
          postState:
            surface: microsoft_excel
            workbookTitle: Forecast.xlsx
            activeWorksheetName: Sheet1
            visibleGrid:
              range: A1:B20
              values: []
            worksheets: []
          browserContext:
            tabId: 123
            surface: microsoft_excel
            observedUrl: https://contoso.sharepoint.com/:x:/r/sites/team/Forecast.xlsx

    NavigationDetectedResult:
      allOf:
        - $ref: "#/components/schemas/BaseCommandResultRequest"
        - type: object
          required: [type, command, navigationInfo]
          properties:
            type:
              const: navigation_detected
            command:
              $ref: "#/components/schemas/NavigationSourceCommand"
            execution:
              oneOf:
                - $ref: "#/components/schemas/ExecutionResult"
                - type: "null"
            browserContext:
              $ref: "#/components/schemas/BrowserContext"
            navigationInfo:
              $ref: "#/components/schemas/NavigationInfo"
      examples:
        - type: navigation_detected
          command:
            type: run_actions
            step: 2
          execution:
            ok: true
            summary: Navigation triggered by click.
            synthetic: true
            results: []
          browserContext:
            tabId: 123
            observedUrl: https://example.com/results
          navigationInfo:
            observedUrl: https://example.com/results
            loading: true
            interruptedAfterExecution: true
            handoffToTabId: null
            source: click

    ReplayBatchExecutedResult:
      allOf:
        - $ref: "#/components/schemas/BaseCommandResultRequest"
        - type: object
          required: [type, command, batchResult, navigationInterrupted, navigationInfo]
          properties:
            type:
              const: replay_batch_executed
            command:
              $ref: "#/components/schemas/RunReplayBatchCommand"
            batchResult:
              $ref: "#/components/schemas/ReplayBatchResult"
            navigationInterrupted:
              type: boolean
            navigationInfo:
              $ref: "#/components/schemas/NavigationInfo"
      examples:
        - type: replay_batch_executed
          command:
            type: run_replay_batch
            runId: run_123
            step: 1
            batch:
              steps: []
            batchIndex: 0
            totalBatchCount: 1
            isFirstBatch: true
            mayCauseNavigation: false
            fileName: replay.json
          batchResult:
            ok: true
            results: []
          navigationInterrupted: false
          navigationInfo:
            observedUrl: https://example.com
            loading: false
            interruptedAfterExecution: false

    ProvideHumanHintRequest:
      type: object
      description: Records human guidance and clears the backend pause state. The resumed planner turn re-extracts page state through the normal command-result loop.
      properties:
        hint:
          type: string
          default: ""
        browserContext:
          $ref: "#/components/schemas/BrowserContext"

    StopRunRequest:
      type: object
      properties:
        reason:
          type: string
          default: stopped_by_user
        message:
          type: string
          default: ""
        deleteRun:
          type: boolean
          default: false

    CommandResponse:
      type: object
      description: Standard envelope for routes that return the next runtime command.
      required: [ok, runId, run, command]
      additionalProperties: true
      properties:
        ok:
          type: boolean
          const: true
        runId:
          type: string
        run:
          oneOf:
            - $ref: "#/components/schemas/RunSnapshot"
            - type: "null"
        command:
          $ref: "#/components/schemas/Command"
        extractedData:
          $ref: "#/components/schemas/NullableObject"
      examples:
        - ok: true
          runId: run_123
          run:
            runId: run_123
            step: 2
            finalResult: null
          command:
            type: run_actions
            runId: run_123
            step: 2
            summary: Fill the search box and press Enter.
            actions:
              - type: fill
                targetId: el_12
                frameId: 0
                value: 423 N Holly St
              - type: press
                targetId: el_12
                frameId: 0
                key: Enter
            plan:
              status: act
              reasoning: The search input is visible.
              summary: Search for the address.
              actions: []
          extractedData: null

    StartCommandRunResponse:
      $ref: "#/components/schemas/CommandResponse"

    TemplateQueueCommandResponse:
      allOf:
        - $ref: "#/components/schemas/CommandResponse"
        - type: object
          required: [templateRunId, queue, item]
          properties:
            templateRunId:
              type: string
            queue:
              oneOf:
                - $ref: "#/components/schemas/TemplateQueueSnapshot"
                - type: "null"
            item:
              oneOf:
                - $ref: "#/components/schemas/TemplateQueueItem"
                - type: "null"

    CompleteTemplateQueueItemResponse:
      type: object
      required: [ok, status, templateRunId, queue, completedItem]
      additionalProperties: true
      properties:
        ok:
          type: boolean
          const: true
        status:
          type: string
          enum: [next_run, finished]
          description: "'next_run' returns the next item command; 'finished' has no next item."
        templateRunId:
          type: string
        queue:
          oneOf:
            - $ref: "#/components/schemas/TemplateQueueSnapshot"
            - type: "null"
        completedItem:
          oneOf:
            - $ref: "#/components/schemas/CompletedTemplateQueueItem"
            - type: "null"
        results:
          type: array
          items:
            type: object
            additionalProperties: true
        item:
          oneOf:
            - $ref: "#/components/schemas/TemplateQueueItem"
            - type: "null"
        runId:
          type:
            - string
            - "null"
        run:
          oneOf:
            - $ref: "#/components/schemas/RunSnapshot"
            - type: "null"
        command:
          oneOf:
            - $ref: "#/components/schemas/Command"
            - type: "null"

    RunMutationResponse:
      allOf:
        - $ref: "#/components/schemas/OkResponse"
        - type: object
          properties:
            run:
              oneOf:
                - $ref: "#/components/schemas/RunSnapshot"
                - type: "null"

    RejectSuccessResponse:
      allOf:
        - $ref: "#/components/schemas/RunMutationResponse"
        - type: object
          properties:
            command:
              oneOf:
                - $ref: "#/components/schemas/Command"
                - type: "null"

    SaveSuccessfulArtifactResponse:
      type: object
      required: [ok]
      additionalProperties: true
      properties:
        ok:
          type: boolean
          const: true
        skipped:
          type: boolean
          description: True when the backend intentionally treats artifact persistence as a no-op.

    RunSnapshot:
      type: object
      description: Compact backend run data returned to the extension.
      additionalProperties: true
      properties:
        runId:
          type: string
        goal:
          type: string
        surface:
          type: string
          examples: [browser_dom, google_sheets, microsoft_excel]
        status:
          type: string
          examples: [running, awaiting_success_confirmation, completed, stopped]
        step:
          type: integer
          minimum: 0
        isTemplateRun:
          type: boolean
        pausedReason:
          type: string
        lastOutcome:
          oneOf:
            - $ref: "#/components/schemas/LastOutcome"
            - type: "null"
        finalResult:
          description: Planner-defined final result shown during success confirmation.
          oneOf:
            - $ref: "#/components/schemas/AnyObject"
            - type: "null"
        createdAt:
          type: string
        updatedAt:
          type: string

    BrowserContext:
      type: object
      additionalProperties: true
      properties:
        tabId:
          type: integer
        attachedTabId:
          type: integer
        surface:
          type: string
          examples: [browser_dom, google_sheets, microsoft_excel]
        lastKnownUrl:
          type: string
        observedUrl:
          type: string
        url:
          type: string
        goal:
          type: string
        step:
          type: integer

    ExtractedState:
      type: object
      description: Structured browser or runtime state produced by a frontend host.
      additionalProperties: true
      properties:
        surface:
          type: string
          examples: [browser_dom, google_sheets, microsoft_excel]
        url:
          type: string
        title:
          type: string
        goal:
          type: string
        step:
          type: integer
        timestamp:
          type: string
        frames:
          type: object
          description: Browser DOM frames keyed by Chrome frameId.
          additionalProperties:
            $ref: "#/components/schemas/ExtractedFrame"
        authStatus:
          type: string
          examples: [authenticated, unauthenticated, unconfigured]
        spreadsheetId:
          type: string
        spreadsheetTitle:
          type: string
        activeSheetName:
          type: string
        sheetTabs:
          type: array
          items:
            type: object
            additionalProperties: true
        workbookDriveId:
          type: string
        workbookItemId:
          type: string
        workbookTitle:
          type: string
        workbookWebUrl:
          type: string
        activeWorksheetName:
          type: string
        worksheets:
          type: array
          items:
            type: object
            additionalProperties: true
        activeRange:
          type: string
        visibleGrid:
          type: object
          additionalProperties: true
        connectorTools:
          type: array
          description: Connector tools hoisted from active browser frames when browser DOM state is active.
          items:
            $ref: "#/components/schemas/ConnectorTool"
        webMcpTools:
          type: array
          description: Planner-normalized WebMCP tools hoisted from browser frames. Each item retains its owning frameId; execution routing metadata is never model-authored.
          maxItems: 32
          items:
            $ref: "#/components/schemas/WebMcpDiscoveredTool"

    ExtractedFrame:
      type: object
      additionalProperties: true
      properties:
        frameId:
          type: integer
        url:
          type: string
        title:
          type: string
        controls:
          type: array
          items:
            $ref: "#/components/schemas/ExtractedControl"
        siteAdapter:
          $ref: "#/components/schemas/SiteAdapterState"
        connectorTools:
          type: array
          description: Connector tools exposed by active site adapters for this frame.
          items:
            $ref: "#/components/schemas/ConnectorTool"
        webMcp:
          $ref: "#/components/schemas/WebMcpDiscoveredState"

    ExtractedControl:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        type:
          type: string
        tag:
          type: string
        label:
          type: string
        selector:
          type: string
        currentValue:
          type: string
          maxLength: 300
          description: Bounded current value for non-sensitive inputs, textareas, and selects. Password, file, and hidden values are omitted.
        selectedValues:
          type: array
          description: Bounded visible values selected in a select control.
          maxItems: 20
          items:
            type: string
            maxLength: 300
        adapterHints:
          type: object
          additionalProperties: true

    WebMcpDiscoveredState:
      type: object
      description: Serializable snapshot of same-frame WebMCP tools discovered through the page model context.
      required: [supported, tools, errors]
      additionalProperties: false
      properties:
        supported:
          type: boolean
          description: True when this frame exposes a WebMCP model context, even if discovery returned no usable tools.
        tools:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/WebMcpDiscoveredTool"
        errors:
          type: array
          description: Bounded discovery or validation failures for page-owned tools that were not exposed to the planner.
          items:
            type: string

    WebMcpDiscoveredTool:
      type: object
      description: Serializable planning-time view of one page-owned WebMCP tool. The live tool handle is re-discovered and verified before execution.
      required: [source, name, origin, parameters, annotations, schemaHash]
      additionalProperties: false
      properties:
        frameId:
          type: integer
          description: Owning browser frame. Added when frame tools are hoisted into planner state.
        source:
          type: string
          const: webmcp
        name:
          type: string
          maxLength: 128
          pattern: "^[A-Za-z0-9_.-]+$"
        title:
          type: string
          maxLength: 240
        description:
          type: string
          maxLength: 1200
        origin:
          type: string
          maxLength: 2048
        parameters:
          type: object
          description: Parsed WebMCP inputSchema presented to the planner as JSON Schema.
          additionalProperties: true
        annotations:
          $ref: "#/components/schemas/WebMcpAnnotations"
        schemaHash:
          type: string
          pattern: "^[A-Fa-f0-9]{8,64}$"
          description: Stable hash used to reject execution when the live input schema changed after planning.

    WebMcpAnnotations:
      type: object
      required: [readOnlyHint, untrustedContentHint]
      additionalProperties: false
      properties:
        readOnlyHint:
          type: boolean
          description: Site-supplied hint that the tool is read-only. False tools require mutation approval in interactive hosts.
        untrustedContentHint:
          type: boolean
          description: Site-supplied hint only; WebGPT treats all page-returned tool output as untrusted regardless of this value.

    SiteAdapterState:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        pageKind:
          type: string
        primaryControlIds:
          type: array
          items:
            type: string
        actionHintsByTargetId:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ActionHint"
        plannerHints:
          type: array
          items:
            type: string

    ConnectorTool:
      type: object
      description: Function-tool schema contributed by an active site adapter via provideTools().
      required: [type, name, parameters]
      additionalProperties: true
      properties:
        type:
          type: string
          const: function
        name:
          type: string
          examples: [greenhouse_fill_select, dotloop_add_person]
        description:
          type: string
        parameters:
          type: object
          additionalProperties: true
        webgpt:
          type: object
          description: WebGPT-owned metadata used for routing, replay, and audit logs. Backends may remove this before presenting the tool schema to an LLM.
          additionalProperties: true
          properties:
            adapterId:
              type: string
            replayable:
              type: boolean
            mayCauseNavigation:
              type: boolean

    ActionHint:
      type: object
      additionalProperties: true
      properties:
        semanticRole:
          type: string
        preferredAction:
          type: string
          enum: [click, fill, press, select, wait, goto]
        exactValueMode:
          type: string
        navigationAction:
          type: boolean
        batchPlacement:
          type: string
        verifyAfterAction:
          type: string

    CommandResultType:
      type: string
      enum:
        - replay_preflight_requested
        - state_extracted
        - navigation_completed
        - actions_executed
        - google_sheets_commands_executed
        - microsoft_excel_commands_executed
        - navigation_detected
        - replay_batch_executed

    Command:
      oneOf:
        - $ref: "#/components/schemas/ExtractStateCommand"
        - $ref: "#/components/schemas/NavigationCompletedCommand"
        - $ref: "#/components/schemas/RunActionsCommand"
        - $ref: "#/components/schemas/RunGoogleSheetsCommandsCommand"
        - $ref: "#/components/schemas/RunMicrosoftExcelCommandsCommand"
        - $ref: "#/components/schemas/RunReplayBatchCommand"
        - $ref: "#/components/schemas/WaitForNavigationCommand"
        - $ref: "#/components/schemas/AskHumanCommand"
        - $ref: "#/components/schemas/DoneCommand"
      discriminator:
        propertyName: type

    BaseCommand:
      type: object
      required: [type]
      additionalProperties: true
      properties:
        type:
          type: string
        runId:
          type: string
        step:
          type: integer
        plan:
          $ref: "#/components/schemas/Plan"

    NavigationSourceCommand:
      type: object
      required: [type]
      additionalProperties: true
      properties:
        type:
          const: run_actions
        step:
          type: integer
        runId:
          type: string

    ExtractStateCommand:
      allOf:
        - $ref: "#/components/schemas/BaseCommand"
        - type: object
          required: [type]
          properties:
            type:
              const: extract_state
            reason:
              type: string
            meta:
              $ref: "#/components/schemas/AnyObject"
            replay:
              $ref: "#/components/schemas/NullableObject"
      examples:
        - type: extract_state
          runId: run_123
          step: 1
          reason: run_started
          meta: {}

    NavigationCompletedCommand:
      allOf:
        - $ref: "#/components/schemas/BaseCommand"
        - type: object
          required: [type]
          properties:
            type:
              const: navigation_completed
            reason:
              type: string
            meta:
              $ref: "#/components/schemas/AnyObject"
      examples:
        - type: navigation_completed
          runId: run_123
          step: 3
          reason: navigation_completed
          meta:
            afterNavigation: true

    RunActionsCommand:
      allOf:
        - $ref: "#/components/schemas/BaseCommand"
        - type: object
          required: [type, actions]
          properties:
            type:
              const: run_actions
            actions:
              type: array
              items:
                $ref: "#/components/schemas/BrowserAction"
            summary:
              type: string
            plannerSummary:
              type: string
      examples:
        - type: run_actions
          runId: run_123
          step: 2
          summary: Fill the search box and press Enter.
          actions:
            - type: fill
              targetId: el_12
              frameId: 0
              value: 423 N Holly St
            - type: press
              targetId: el_12
              frameId: 0
              key: Enter
          plan:
            status: act
            reasoning: The search input is visible.
            summary: Search for the address.
            actions: []
        - type: run_actions
          runId: run_456
          step: 3
          summary: Add a Dotloop person through the active modal.
          actions:
            - type: dotloop_add_person
              name: Morgan Lee
              email: morgan.lee@example.com
              phone: 215-555-0198
              role: Tenant
              sendIntroEmail: true
              addToTeam: false
        - type: run_actions
          runId: run_789
          step: 2
          summary: Check available booking slots through the page API.
          actions:
            - type: webmcp_f0_getAvailability_0123456789abcdef
              executor: webmcp
              frameId: 0
              arguments:
                date: "2026-07-14"
              webMcp:
                name: getAvailability
                origin: https://example.test
                schemaHash: 0123456789abcdef
                readOnlyHint: true
                untrustedContentHint: true
              mayCauseNavigation: false

    RunGoogleSheetsCommandsCommand:
      allOf:
        - $ref: "#/components/schemas/BaseCommand"
        - type: object
          required: [type, commands]
          properties:
            type:
              const: run_google_sheets_commands
            surface:
              const: google_sheets
            commands:
              type: array
              items:
                $ref: "#/components/schemas/RuntimeCommand"
            summary:
              type: string
            plannerSummary:
              type: string
      examples:
        - type: run_google_sheets_commands
          surface: google_sheets
          runId: run_123
          step: 2
          summary: Update the selected sheet.
          commands:
            - name: write_values
              sheetName: Sheet1
              range: Sheet1!A1:B2
              values:
                - [Name, Status]
                - [Ada, Done]

    RunMicrosoftExcelCommandsCommand:
      allOf:
        - $ref: "#/components/schemas/BaseCommand"
        - type: object
          required: [type, commands]
          properties:
            type:
              const: run_microsoft_excel_commands
            surface:
              const: microsoft_excel
            commands:
              type: array
              items:
                $ref: "#/components/schemas/RuntimeCommand"
            summary:
              type: string
            plannerSummary:
              type: string
      examples:
        - type: run_microsoft_excel_commands
          surface: microsoft_excel
          runId: run_123
          step: 2
          summary: Update the workbook.
          commands:
            - name: write_range
              worksheetName: Sheet1
              range: A1:B2
              values:
                - [Name, Status]
                - [Ada, Done]

    RuntimeCommand:
      type: object
      required: [name]
      additionalProperties: true
      properties:
        name:
          type: string
          enum:
            - read_values
            - add_sheet
            - write_values
            - append_values
            - find_rows
            - format_range
            - set_active_range
            - read_range
            - write_range
            - append_rows
            - list_worksheets
        sheetName:
          type: string
        worksheetName:
          type: string
        range:
          type: string
        values:
          type: array
          items:
            type: array
            items: {}
        query:
          type: string
        columns:
          type: array
          items:
            type: string
        matchMode:
          type: string
          enum: [exact, contains]
        caseSensitive:
          type: boolean
        limit:
          type: integer
        format:
          type: object
          additionalProperties: true
        majorDimension:
          type: string
        inputOption:
          type: string
        insertDataOption:
          type: string
        startColumn:
          type: string

    RunReplayBatchCommand:
      allOf:
        - $ref: "#/components/schemas/BaseCommand"
        - type: object
          required: [type, batch]
          properties:
            type:
              const: run_replay_batch
            batch:
              type: object
              additionalProperties: true
              properties:
                steps:
                  type: array
                  items:
                    $ref: "#/components/schemas/ReplayStep"
            batchIndex:
              type: integer
            totalBatchCount:
              type: integer
            isFirstBatch:
              type: boolean
            mayCauseNavigation:
              type: boolean
            fileName:
              type: string
      examples:
        - type: run_replay_batch
          runId: run_123
          step: 1
          batch:
            steps:
              - action:
                  type: dotloop_add_person
                  name: <USER_PROVIDED_VALUE>
                  email: <USER_PROVIDED_VALUE>
                  phone: <USER_PROVIDED_VALUE>
                  role: <USER_PROVIDED_VALUE>
                  inputBindings:
                    - path: [name]
                      inputKey: input_0
                      originalValue: Morgan Lee
                replayTarget:
                  kind: connector-tool
                  snapshot:
                    toolName: dotloop_add_person
                    adapterIds: [dotloop.local]
                    pageKind: add_person_modal
                    replayable: true
                    mayCauseNavigation: false
          batchIndex: 0
          totalBatchCount: 1
          isFirstBatch: true
          mayCauseNavigation: false
          fileName: replay.json

    WaitForNavigationCommand:
      allOf:
        - $ref: "#/components/schemas/BaseCommand"
        - type: object
          required: [type]
          properties:
            type:
              const: wait_for_navigation
            observedUrl:
              type: string
            url:
              type: string
            source:
              type: string
      examples:
        - type: wait_for_navigation
          runId: run_123
          step: 2
          observedUrl: https://example.com/results
          source: click

    AskHumanCommand:
      allOf:
        - $ref: "#/components/schemas/BaseCommand"
        - type: object
          required: [type]
          properties:
            type:
              const: ask_human
            message:
              type: string
      examples:
        - type: ask_human
          runId: run_123
          step: 4
          message: Please choose the correct account before continuing.

    DoneCommand:
      allOf:
        - $ref: "#/components/schemas/BaseCommand"
        - type: object
          required: [type]
          properties:
            type:
              const: done
            summary:
              type: string
            plannerSummary:
              type: string
            finalResult:
              description: Planner-defined final result shown in the UI.
      examples:
        - type: done
          runId: run_123
          step: 5
          summary: Found the property zoning and dimensions.
          plannerSummary: Task completed successfully.
          finalResult:
            summary: Found the property zoning and dimensions.

    BrowserAction:
      type: object
      required: [type]
      additionalProperties: true
      properties:
        type:
          type: string
          description: Built-in browser action type, active connector tool name, or generated WebMCP planner name.
          examples: [click, fill, press, wait, goto, scroll, dotloop_add_person, webmcp_f0_getAvailability_0123456789abcdef]
        executor:
          type: string
          description: Explicit execution route. WebMCP actions use webmcp; ordinary DOM and connector actions may omit this property.
          examples: [webmcp, browser]
        targetId:
          type: string
        frameId:
          type: integer
        value:
          type: string
        key:
          type: string
        direction:
          type: string
        ms:
          type: integer
        url:
          type: string
        fieldKey:
          type: string
          description: Connector field key for single-field connector actions.
        fieldValues:
          type: object
          description: Connector field values keyed by adapter-defined field or placeholder keys.
          additionalProperties:
            type: string
        inputBindings:
          type: array
          description: Replay input bindings for templated action arguments, including nested connector args.
          items:
            $ref: "#/components/schemas/ReplayInputBinding"
        arguments:
          type: object
          description: Exact page-tool arguments. For executor=webmcp this nested object alone is serialized for executeTool; it is size-validated but never compacted or truncated on the live execution path.
          additionalProperties: true
        webMcp:
          $ref: "#/components/schemas/WebMcpRouteMetadata"
        mayCauseNavigation:
          type: boolean
          description: True when a connector, browser, or mutating WebMCP action can trigger navigation and must be a batch boundary.
        navigationAction:
          type: boolean
          description: Compatibility alias used by adapter hints and some planner outputs.
        name:
          type: string
          description: Connector argument commonly used by add-person or recipient tools.
        email:
          type: string
        phone:
          type: string
        role:
          type: string
        sendIntroEmail:
          type: boolean
        addToTeam:
          type: boolean

    WebMcpRouteMetadata:
      type: object
      description: Backend-owned WebMCP route captured from discovery. The planner supplies only the generated tool name and arguments; frameId and these values are attached from a private route map.
      required: [name, origin, schemaHash, readOnlyHint, untrustedContentHint]
      additionalProperties: false
      properties:
        plannerName:
          type: string
          maxLength: 64
          description: Generated, frame-qualified planner tool name when retained in history or effects.
        name:
          type: string
          maxLength: 128
          pattern: "^[A-Za-z0-9_.-]+$"
          description: Original page-owned WebMCP tool name.
        origin:
          type: string
          maxLength: 2048
        schemaHash:
          type: string
          pattern: "^[A-Fa-f0-9]{8,64}$"
        readOnlyHint:
          type: boolean
        untrustedContentHint:
          type: boolean

    ReplayInputBinding:
      type: object
      additionalProperties: true
      properties:
        path:
          type: array
          description: Path inside the action object to replace with the input value.
          items:
            type: string
        inputKey:
          type: string
        originalValue:
          type: string

    ReplayStep:
      type: object
      description: Saved replay step. Browser DOM steps use action/replayTarget; connector steps use action plus replayTarget.kind=connector-tool; runtime steps use surface/command.
      additionalProperties: true
      properties:
        action:
          $ref: "#/components/schemas/BrowserAction"
        replayTarget:
          $ref: "#/components/schemas/ReplayTarget"
        surface:
          type: string
          examples: [google_sheets, microsoft_excel]
        commandName:
          type: string
        command:
          oneOf:
            - $ref: "#/components/schemas/RuntimeCommand"
            - $ref: "#/components/schemas/AnyObject"

    ReplayTarget:
      type: object
      additionalProperties: true
      properties:
        kind:
          type: string
          enum:
            - control
            - scrollable-container
            - extract-targets
            - goto
            - connector-tool
        snapshot:
          oneOf:
            - $ref: "#/components/schemas/ConnectorReplayTargetSnapshot"
            - $ref: "#/components/schemas/AnyObject"

    ConnectorReplayTargetSnapshot:
      type: object
      additionalProperties: true
      properties:
        toolName:
          type: string
          examples: [dotloop_add_person]
        adapterIds:
          type: array
          items:
            type: string
        pageKind:
          type: string
        url:
          type: string
        title:
          type: string
        replayable:
          type: boolean
        mayCauseNavigation:
          type: boolean

    Plan:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
        reasoning:
          type: string
        summary:
          type: string
        actions:
          type: array
          items:
            $ref: "#/components/schemas/BrowserAction"

    ExecutionResult:
      type: object
      additionalProperties: true
      properties:
        ok:
          type: boolean
        summary:
          type: string
        error:
          type: string
        frameId:
          type:
            - integer
            - "null"
        tabId:
          type: integer
        synthetic:
          type: boolean
        results:
          type: array
          items:
            $ref: "#/components/schemas/ActionExecutionEntry"

    ActionExecutionEntry:
      type: object
      description: Typed browser-action entry. Runtime surfaces may instead return command-specific properties, which remain allowed.
      additionalProperties: true
      properties:
        action:
          $ref: "#/components/schemas/BrowserAction"
        result:
          $ref: "#/components/schemas/ActionExecutionOutcome"

    ActionExecutionOutcome:
      type: object
      description: Result returned by a page-runtime action executor. WebMCP output is bounded for transport/history, while the exact nested action arguments are kept separately on the command.
      additionalProperties: true
      properties:
        ok:
          type: boolean
        committed:
          type: boolean
        detail:
          type: string
        error:
          type: string
        recoverable:
          type: boolean
        continueBatch:
          type: boolean
        frameId:
          type: integer
        tabId:
          type: integer
        navigationStarted:
          type: boolean
          description: True when executeTool returned null or another executor reported that navigation began.
        webMcp:
          $ref: "#/components/schemas/WebMcpExecutionMetadata"
        webMcpOutput:
          description: JSON-safe, transport-bounded page-tool return value. Present for both read-only and mutating WebMCP tools; null is preserved when executeTool starts navigation.
        webMcpOutputMeta:
          $ref: "#/components/schemas/WebMcpOutputMetadata"
        extractionBatch:
          $ref: "#/components/schemas/ExtractionBatch"

    WebMcpExecutionMetadata:
      type: object
      description: Verified execution or history metadata for a WebMCP tool.
      additionalProperties: false
      properties:
        plannerName:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 128
        origin:
          type: string
          maxLength: 2048
        schemaHash:
          type: string
          pattern: "^[A-Fa-f0-9]{8,64}$"
        readOnlyHint:
          type: boolean
        untrustedContentHint:
          type: boolean
        annotations:
          $ref: "#/components/schemas/WebMcpAnnotations"
        outputPresent:
          type: boolean
        outputKind:
          type: string
          examples: [object, array, string, number, boolean, "null"]
        outputTruncated:
          type: boolean
        outputByteLength:
          type: integer
          minimum: 0

    WebMcpOutputMetadata:
      type: object
      required: [truncated, byteLength]
      additionalProperties: false
      properties:
        truncated:
          type: boolean
          description: True when non-JSON values, depth/collection limits, or the 64 KiB output cap required compaction.
        byteLength:
          type: integer
          minimum: 0
          maximum: 65536

    ExtractionBatch:
      type: object
      description: Structured extraction returned by an action. Read-only WebMCP tools emit one untrusted webmcp_tool_result item.
      additionalProperties: true
      properties:
        frameId:
          type: integer
        targetId:
          type: string
        extractedCount:
          type: integer
          minimum: 0
        context:
          type: object
          additionalProperties: true
          properties:
            source:
              type: string
              examples: [webmcp]
            plannerName:
              type: string
            toolName:
              type: string
            origin:
              type: string
            untrustedContent:
              type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExtractionItem"

    ExtractionItem:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        targetId:
          type: string
        kind:
          type: string
          examples: [webmcp_tool_result]
        adapterId:
          type: string
          examples: [webmcp]
        preferredAction:
          type: string
          examples: [extract]
        label:
          type: string
        text:
          type: string
        toolName:
          type: string
        origin:
          type: string
        untrustedContent:
          type: boolean

    LastOutcome:
      type: object
      description: Backend summary of the latest command. Browser actions include the independently computed state delta and action effect used by the next planner turn.
      additionalProperties: true
      properties:
        ok:
          type: boolean
        kind:
          type: string
        detail:
          type: string
        executionSummary:
          type: string
        actionResults:
          type: array
          maxItems: 20
          description: Ordered, prompt-safe evidence for the planned action batch. Exact executable arguments remain in the command and are not reconstructed from this compact view.
          items:
            $ref: "#/components/schemas/ActionResultEvidence"
        actionResultsTruncated:
          type: boolean
        stateDelta:
          oneOf:
            - $ref: "#/components/schemas/BrowserStateDelta"
            - type: "null"
        actionEffect:
          oneOf:
            - $ref: "#/components/schemas/BrowserActionEffect"
            - type: "null"

    BrowserStateDelta:
      type: object
      description: Post-action browser state comparison. WebMCP actions also receive targetless value diffs and discovered-tool-set diffs.
      additionalProperties: true
      properties:
        urlChanged:
          type: boolean
        titleChanged:
          type: boolean
        noveltyScore:
          type: number
          minimum: 0
          maximum: 1
        scroll:
          type: object
          additionalProperties: true
        controls:
          $ref: "#/components/schemas/CollectionDelta"
        groups:
          $ref: "#/components/schemas/CollectionDelta"
        webMcpTools:
          $ref: "#/components/schemas/WebMcpToolSetDelta"
        fieldUpdates:
          type: array
          items:
            $ref: "#/components/schemas/FieldUpdate"
        untargetedFieldUpdates:
          type: array
          description: Value changes detected without a DOM target, primarily after WebMCP execution.
          items:
            $ref: "#/components/schemas/UntargetedFieldUpdate"
        targetControl:
          type: object
          additionalProperties: true
        targetScrollContainer:
          type: object
          additionalProperties: true
        headings:
          $ref: "#/components/schemas/CollectionDelta"
        visibleText:
          $ref: "#/components/schemas/CollectionDelta"
        overlays:
          $ref: "#/components/schemas/CollectionDelta"
        overlaysChanged:
          type: boolean

    CollectionDelta:
      type: object
      additionalProperties: true
      properties:
        beforeCount:
          type: integer
        afterCount:
          type: integer
        deltaCount:
          type: integer
        overlapCount:
          type: integer
        addedCount:
          type: integer
        removedCount:
          type: integer
        changedRatio:
          type: number
          minimum: 0
          maximum: 1
        added:
          type: array
          items: {}
        removed:
          type: array
          items: {}

    WebMcpToolSetDelta:
      type: object
      additionalProperties: false
      properties:
        beforeCount:
          type: integer
        afterCount:
          type: integer
        addedCount:
          type: integer
        removedCount:
          type: integer
        changedCount:
          type: integer
        totalChanged:
          type: integer
        changedRatio:
          type: number
          minimum: 0
          maximum: 1
        added:
          type: array
          items:
            $ref: "#/components/schemas/WebMcpToolDeltaDescriptor"
        removed:
          type: array
          items:
            $ref: "#/components/schemas/WebMcpToolDeltaDescriptor"
        changed:
          type: array
          items:
            $ref: "#/components/schemas/WebMcpToolDeltaDescriptor"

    WebMcpToolDeltaDescriptor:
      type: object
      additionalProperties: false
      properties:
        plannerName:
          type: string
        name:
          type: string
        origin:
          type: string
        schemaHash:
          type: string
        readOnlyHint:
          type:
            - boolean
            - "null"
        untrustedContentHint:
          type:
            - boolean
            - "null"

    FieldUpdate:
      type: object
      additionalProperties: true
      properties:
        source:
          type: string
        targetId:
          type: string
        controlId:
          type: string
        groupId:
          type: string
        groupTargetId:
          type: string
        label:
          type: string
        beforeValue:
          type: string
        afterValue:
          type: string
        expectedValue:
          type: string
        changed:
          type: boolean
        verified:
          type: boolean
        confidence:
          type: string

    UntargetedFieldUpdate:
      type: object
      additionalProperties: false
      properties:
        source:
          type: string
          examples: [control, adapter_group]
        controlId:
          type: string
        groupId:
          type: string
        groupTargetId:
          type: string
        label:
          type: string
        beforeValue:
          type: string
        afterValue:
          type: string
        changed:
          type: boolean
        verification:
          type: string
          examples: [observed]

    BrowserActionEffect:
      type: object
      description: Aggregate semantic interpretation of the complete ordered action batch, its tool output, and the single independently observed post-state change.
      additionalProperties: true
      properties:
        actionType:
          type: string
        effectCategory:
          type: string
          examples: [extraction, meaningful_change, reported_change_unverified, execution_failed, navigation]
        likelySucceeded:
          type: boolean
        meaningfulEffect:
          type: boolean
        executionSucceeded:
          type: boolean
        verification:
          type: string
          description: Aggregate verification basis. WebMCP uses tool_output when read results are the batch evidence, observed for independent post-state evidence, reported when a mutation completed without independent evidence, and none on execution failure.
          examples: [tool_output, observed, reported, none]
        verificationScope:
          type: string
          description: For a batch containing WebMCP, batch means observed state verifies the batch as a whole and does not assign causality to one mutation.
          examples: [batch]
        explanation:
          type: string
        frameId:
          type:
            - integer
            - "null"
        signals:
          $ref: "#/components/schemas/BrowserActionEffectSignals"
        fieldUpdates:
          type: array
          items:
            $ref: "#/components/schemas/FieldUpdate"
        webMcp:
          $ref: "#/components/schemas/WebMcpExecutionMetadata"
          description: Single-call compatibility metadata; omitted when the batch contains multiple WebMCP actions.
        webMcpOutputSummary:
          description: Single-call compatibility output; per-call summaries for mixed or multi-WebMCP batches live in actionResults.
          oneOf:
            - $ref: "#/components/schemas/WebMcpOutputSummary"
            - type: "null"
        extractedData:
          oneOf:
            - $ref: "#/components/schemas/AnyObject"
            - type: "null"

    BrowserActionEffectSignals:
      type: object
      additionalProperties: true
      properties:
        webMcp:
          type: boolean
        webMcpActionCount:
          type: integer
          minimum: 0
        webMcpExecutedCount:
          type: integer
          minimum: 0
        webMcpSucceededCount:
          type: integer
          minimum: 0
        webMcpFailedCount:
          type: integer
          minimum: 0
        webMcpNotExecutedCount:
          type: integer
          minimum: 0
        webMcpUnknownCount:
          type: integer
          minimum: 0
        webMcpReadOnlyCount:
          type: integer
          minimum: 0
        webMcpMutationCount:
          type: integer
          minimum: 0
        webMcpOutputCount:
          type: integer
          minimum: 0
        plannerName:
          type: string
        toolName:
          type: string
        origin:
          type: string
        readOnlyHint:
          type:
            - boolean
            - "null"
        untrustedContentHint:
          type:
            - boolean
            - "null"
        outputPresent:
          type: boolean
        outputKind:
          type: string
        outputTruncated:
          type: boolean
        outputByteLength:
          type: integer
          minimum: 0
        navigationStarted:
          type: boolean
        navigationStartedCount:
          type: integer
          minimum: 0
        toolSetChanged:
          type: boolean
        toolSetChangeCount:
          type: integer
        webMcpToolSetChangeCount:
          type: integer
        fieldUpdateCount:
          type: integer
        untargetedFieldUpdateCount:
          type: integer
        urlChanged:
          type: boolean
        titleChanged:
          type: boolean
        visibleTextChangedRatio:
          type: number
        controlsChangedRatio:
          type: number
        groupsChangedRatio:
          type: number
        overlaysChanged:
          type: boolean
        noveltyScore:
          type: number

    ActionResultEvidence:
      type: object
      description: Bounded evidence for one action at its planner-ordered batch index. WebMCP callbacks are reported per call; observed state deltas remain batch-scoped.
      additionalProperties: false
      required: [actionIndex, actionType, status, navigationStarted]
      properties:
        actionIndex:
          type: integer
          minimum: 0
        resultIndex:
          type: integer
          minimum: 0
        actionType:
          type: string
        executor:
          type: string
        status:
          type: string
          enum: [succeeded, failed, not_executed, unknown]
        executionSucceeded:
          type: boolean
        detail:
          type: string
        error:
          type: string
        committed:
          type: boolean
        navigationStarted:
          type: boolean
        verification:
          type: string
          enum: [tool_output, reported, none]
        webMcp:
          $ref: "#/components/schemas/WebMcpExecutionMetadata"
        webMcpOutputSummary:
          oneOf:
            - $ref: "#/components/schemas/WebMcpOutputSummary"
            - type: "null"

    WebMcpOutputSummary:
      type: object
      description: Prompt/history-safe summary of a WebMCP result; this is separate from exact execution arguments.
      additionalProperties: false
      properties:
        present:
          type: boolean
        kind:
          type: string
        truncated:
          type: boolean
        preview:
          description: Depth-, string-, collection-, and key-bounded output preview.
        byteLength:
          type: integer
          minimum: 0
        itemCount:
          type: integer
          minimum: 0
        keyCount:
          type: integer
          minimum: 0

    ReplayBatchResult:
      type: object
      additionalProperties: true
      properties:
        ok:
          type: boolean
        error:
          type: string
        results:
          type: array
          items:
            type: object
            additionalProperties: true

    NavigationInfo:
      type: object
      additionalProperties: true
      properties:
        observedUrl:
          type: string
        loading:
          type: boolean
        interruptedAfterExecution:
          type: boolean
        browserContext:
          $ref: "#/components/schemas/BrowserContext"
        handoffToTabId:
          type:
            - integer
            - "null"
        source:
          type: string

    InputSchemaItem:
      type: object
      additionalProperties: true
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
        required:
          type: boolean

    SavedArtifactSummary:
      type: object
      additionalProperties: true
      properties:
        goal:
          type: string
        description:
          type: string
        successfulReplayArtifactFileName:
          type: string
        updatedAt:
          type: string
        inputSchema:
          type: array
          items:
            $ref: "#/components/schemas/InputSchemaItem"

    TemplateQueueSnapshot:
      type: object
      additionalProperties: true
      properties:
        templateRunId:
          type: string
        status:
          type: string
          examples: [running, completed]
        currentIndex:
          type: integer
        totalRuns:
          type: integer
        activeRunId:
          type:
            - string
            - "null"
        artifactFileName:
          type: string
        surface:
          type: string
          examples: [browser_dom, google_sheets, microsoft_excel]
        results:
          type: array
          items:
            $ref: "#/components/schemas/CompletedTemplateQueueItem"
        createdAt:
          type: string
        updatedAt:
          type: string

    TemplateQueueItem:
      type: object
      additionalProperties: true
      properties:
        index:
          type: integer
        totalRuns:
          type: integer
        goal:
          type: string
        inputValues:
          $ref: "#/components/schemas/AnyObject"
        inputLabel:
          type: string
        inputValue:
          type: string

    CompletedTemplateQueueItem:
      allOf:
        - $ref: "#/components/schemas/TemplateQueueItem"
        - type: object
          additionalProperties: true
          properties:
            runId:
              type: string
            summary:
              type: string
            finalResult:
              oneOf:
                - $ref: "#/components/schemas/AnyObject"
                - type: "null"

    ArtifactByFileNameResponse:
      type: object
      required: [ok, fileName, artifactType, artifact]
      additionalProperties: true
      properties:
        ok:
          type: boolean
          const: true
        fileName:
          type: string
        artifactType:
          type: string
          enum:
            - successfulRun
            - successfulExecutionTrace
            - successfulReplayArtifact
        artifact:
          oneOf:
            - $ref: "#/components/schemas/AnyObject"
            - type: "null"

    FindReplayArtifactResponse:
      type: object
      required: [ok, fileName, artifact]
      additionalProperties: true
      properties:
        ok:
          type: boolean
          const: true
        fileName:
          type:
            - string
            - "null"
        artifact:
          oneOf:
            - $ref: "#/components/schemas/AnyObject"
            - type: "null"
